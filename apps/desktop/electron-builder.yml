appId: com.knowledge.desktop
productName: Knowledge Desktop
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraResources:
  - from: electron/db/schema.sql
    to: schema.sql
